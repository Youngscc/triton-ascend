<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Triton Ascend 参数实验报告</title>
  <style>
    :root {
      color-scheme: light dark;
      --background: #f8fafc;
      --surface: #ffffff;
      --foreground: #172033;
      --muted: #5f6b7c;
      --border: #d8dee8;
      --grid: #e7ebf1;
      --latency: #2563eb;
      --ub: #d97706;
      --ok: #15803d;
      --bad: #b42318;
      --focus: #2563eb;
      --shadow: 0 10px 30px rgba(25, 35, 55, 0.08);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --background: #111827;
        --surface: #182235;
        --foreground: #edf2f7;
        --muted: #aeb9c8;
        --border: #344156;
        --grid: #2b374a;
        --latency: #60a5fa;
        --ub: #fbbf24;
        --ok: #4ade80;
        --bad: #fb7185;
        --focus: #93c5fd;
        --shadow: none;
      }
    }
    * { box-sizing: border-box; }
    html, body { max-width: 100%; overflow-x: hidden; }
    body {
      margin: 0;
      background: var(--background);
      color: var(--foreground);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      line-height: 1.5;
    }
    main {
      width: calc(100% - 32px);
      max-width: 1240px;
      margin: 0 auto;
      padding: 28px 0 48px;
    }
    h1, h2 { margin: 0; font-weight: 600; }
    h1 { font-size: clamp(24px, 3vw, 34px); }
    h2 { font-size: 18px; }
    .subtitle, .run-meta, .selection-summary, .footnote {
      color: var(--muted);
    }
    .subtitle { margin: 5px 0 0; }
    .run-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 7px 18px;
      margin-top: 12px;
      font-size: 13px;
    }
    .run-meta span {
      min-width: 0;
      max-width: 100%;
      overflow-wrap: anywhere;
      word-break: break-word;
    }
    .selection-summary { overflow-wrap: anywhere; }
    .controls {
      display: grid;
      grid-template-columns: repeat(5, minmax(150px, 1fr));
      gap: 14px;
      margin: 24px 0 14px;
      padding: 18px;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: var(--surface);
      box-shadow: var(--shadow);
    }
    label {
      display: grid;
      min-width: 0;
      gap: 6px;
      color: var(--muted);
      font-size: 13px;
    }
    select {
      width: 100%;
      min-width: 0;
      min-height: 40px;
      padding: 7px 34px 7px 10px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--surface);
      color: var(--foreground);
      font: inherit;
    }
    select:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
    .selection-summary {
      min-height: 24px;
      margin: 0 2px 12px;
      font-size: 14px;
    }
    .warning { color: var(--bad); }
    .charts {
      display: grid;
      width: 100%;
      min-width: 0;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 18px;
    }
    .chart-panel {
      position: relative;
      min-width: 0;
      max-width: 100%;
      padding: 16px 14px 10px;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: var(--surface);
      box-shadow: var(--shadow);
    }
    .chart-heading {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 12px;
      padding: 0 4px 4px;
    }
    .chart-unit { color: var(--muted); font-size: 13px; }
    svg { display: block; width: 100%; min-width: 0; height: auto; overflow: visible; }
    .chart-frame { fill: none; stroke: var(--border); }
    .chart-grid { stroke: var(--grid); stroke-width: 1; }
    .chart-zero { stroke: var(--muted); stroke-width: 1; stroke-dasharray: 4 4; }
    .chart-axis { stroke: var(--border); }
    .chart-line { fill: none; stroke-width: 2.5; stroke-linejoin: round; stroke-linecap: round; }
    .chart-point { stroke: var(--surface); stroke-width: 2; }
    .chart-hit { fill: transparent; cursor: crosshair; }
    .chart-text, .axis-title { fill: var(--foreground); font-size: 12px; }
    .chart-muted { fill: var(--muted); font-size: 11px; }
    .chart-value { fill: var(--foreground); font-size: 11px; font-weight: 500; }
    .tooltip {
      position: absolute;
      z-index: 2;
      display: none;
      max-width: 260px;
      padding: 8px 10px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--surface);
      color: var(--foreground);
      box-shadow: var(--shadow);
      font-size: 12px;
      pointer-events: none;
    }
    .details {
      margin-top: 18px;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: var(--surface);
      box-shadow: var(--shadow);
      overflow: hidden;
    }
    .details h2 { padding: 16px 18px 10px; }
    .table-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th, td {
      padding: 10px 12px;
      border-top: 1px solid var(--border);
      text-align: right;
      white-space: nowrap;
    }
    th { color: var(--muted); font-weight: 500; }
    th:first-child, td:first-child, th:nth-child(6), td:nth-child(6) { text-align: left; }
    .status-measured { color: var(--ok); }
    .status-failed { color: var(--bad); }
    .footnote { margin: 14px 2px 0; font-size: 12px; }
    @media (max-width: 920px) {
      .controls { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .charts { grid-template-columns: 1fr; }
    }
    @media (max-width: 520px) {
      main { width: calc(100% - 20px); padding-top: 18px; }
      .controls { grid-template-columns: 1fr; padding: 14px; }
      .chart-panel { padding-inline: 8px; }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>Triton Ascend 参数实验</h1>
      <p class="subtitle">固定两个编译参数，观察第三个参数对执行时间和 UB 使用量的影响。</p>
      <div id="run-meta" class="run-meta" aria-live="polite"></div>
    </header>

    <section class="controls" aria-label="实验筛选条件">
      <label>算子<select id="operator-select"></select></label>
      <label>横轴变量<select id="axis-select"></select></label>
      <label><span id="fixed-one-label"></span><select id="fixed-one-select"></select></label>
      <label><span id="fixed-two-label"></span><select id="fixed-two-select"></select></label>
      <label>显示方式
        <select id="mode-select">
          <option value="absolute">绝对值</option>
          <option value="relative">相对首个点变化</option>
        </select>
      </label>
    </section>

    <div id="selection-summary" class="selection-summary" aria-live="polite"></div>

    <section class="charts" aria-label="指标趋势图">
      <article class="chart-panel" id="latency-panel">
        <div class="chart-heading"><h2>执行时间</h2><span id="latency-unit" class="chart-unit"></span></div>
        <svg id="latency-chart" role="img" aria-label="执行时间趋势图"></svg>
        <div id="latency-tooltip" class="tooltip" role="tooltip"></div>
      </article>
      <article class="chart-panel" id="ub-panel">
        <div class="chart-heading"><h2>UB 使用量</h2><span id="ub-unit" class="chart-unit"></span></div>
        <svg id="ub-chart" role="img" aria-label="UB 使用量趋势图"></svg>
        <div id="ub-tooltip" class="tooltip" role="tooltip"></div>
      </article>
    </section>

    <section class="details">
      <h2>当前切片的配置明细</h2>
      <div class="table-wrap">
        <table>
          <thead><tr>
            <th id="table-axis">变量</th>
            <th>latency_ms</th>
            <th>性能变化</th>
            <th>UB_KiB</th>
            <th>UB变化</th>
            <th>状态</th>
            <th>binary</th>
          </tr></thead>
          <tbody id="details-body"></tbody>
        </table>
      </div>
    </section>

    <p class="footnote">相对变化以当前切片中横轴最小且成功测量的配置为基线。负的性能变化表示更快；正的 UB 变化表示使用更多片上内存。页面不选择或推荐最佳配置。</p>
  </main>

  <script id="experiment-data" type="application/json">__EXPERIMENT_REPORT_DATA__</script>
  <script>
    (() => {
      "use strict";

      const report = JSON.parse(document.getElementById("experiment-data").textContent);
      const axes = {
        depth: { label: "CV depth", short: "depth" },
        multibuffer_num: { label: "普通 multibuffer 数量", short: "multibuffer" },
        vf_merge_level: { label: "VF merge level", short: "merge" }
      };
      const axisKeys = Object.keys(axes);
      const elements = {
        operator: document.getElementById("operator-select"),
        axis: document.getElementById("axis-select"),
        fixedOneLabel: document.getElementById("fixed-one-label"),
        fixedOne: document.getElementById("fixed-one-select"),
        fixedTwoLabel: document.getElementById("fixed-two-label"),
        fixedTwo: document.getElementById("fixed-two-select"),
        mode: document.getElementById("mode-select"),
        runMeta: document.getElementById("run-meta"),
        summary: document.getElementById("selection-summary"),
        latencyUnit: document.getElementById("latency-unit"),
        ubUnit: document.getElementById("ub-unit"),
        tableAxis: document.getElementById("table-axis"),
        detailsBody: document.getElementById("details-body")
      };
      const svgNS = "http://www.w3.org/2000/svg";
      let fixedKeys = [];
      let currentRows = [];
      const preferredValues = {};

      function uniqueNumeric(rows, key) {
        return [...new Set(rows.map(row => row[key]).filter(value => value !== null && value !== undefined))]
          .sort((a, b) => Number(a) - Number(b));
      }

      function setOptions(select, values, preferred) {
        select.replaceChildren();
        values.forEach(value => {
          const option = document.createElement("option");
          option.value = String(value);
          option.textContent = String(value);
          select.appendChild(option);
        });
        const desired = preferred !== undefined && values.some(value => String(value) === String(preferred))
          ? String(preferred)
          : String(values[0] ?? "");
        select.value = desired;
      }

      function selectedOperator() {
        return report.operators.find(operator => operator.id === elements.operator.value) || report.operators[0];
      }

      function matches(row, key, value) {
        return String(row[key]) === String(value);
      }

      function rememberFixedValues() {
        if (fixedKeys[0] && elements.fixedOne.value !== "") {
          preferredValues[fixedKeys[0]] = elements.fixedOne.value;
        }
        if (fixedKeys[1] && elements.fixedTwo.value !== "") {
          preferredValues[fixedKeys[1]] = elements.fixedTwo.value;
        }
      }

      function refreshSecondFixed() {
        const operator = selectedOperator();
        const rows = operator.rows.filter(row => matches(row, fixedKeys[0], elements.fixedOne.value));
        setOptions(elements.fixedTwo, uniqueNumeric(rows, fixedKeys[1]), preferredValues[fixedKeys[1]]);
        preferredValues[fixedKeys[1]] = elements.fixedTwo.value;
      }

      function refreshFilters() {
        const operator = selectedOperator();
        const previouslyFixed = [...fixedKeys];
        fixedKeys = axisKeys.filter(key => key !== elements.axis.value);
        elements.fixedOneLabel.textContent = `固定 ${axes[fixedKeys[0]].label}`;
        elements.fixedTwoLabel.textContent = `固定 ${axes[fixedKeys[1]].label}`;

        // Preserve parameters that were already fixed before the operator/axis
        // change.  On sparse result sets, select a compatible value for the
        // newly-fixed parameter instead of resetting an unchanged parameter.
        const chosen = operator.rows.reduce((best, row) => {
          const score = fixedKeys.reduce((total, key) => {
            if (preferredValues[key] === undefined || !matches(row, key, preferredValues[key])) return total;
            return total + (previouslyFixed.includes(key) ? 100 : 10);
          }, 0);
          return best === null || score > best.score ? { row, score } : best;
        }, null)?.row;
        if (chosen) {
          preferredValues[fixedKeys[0]] = String(chosen[fixedKeys[0]]);
          preferredValues[fixedKeys[1]] = String(chosen[fixedKeys[1]]);
        }

        setOptions(elements.fixedOne, uniqueNumeric(operator.rows, fixedKeys[0]), preferredValues[fixedKeys[0]]);
        preferredValues[fixedKeys[0]] = elements.fixedOne.value;
        refreshSecondFixed();
        render();
      }

      function formatNumber(value, digits = 6) {
        if (value === null || value === undefined || Number.isNaN(Number(value))) return "—";
        return Number(value).toFixed(digits);
      }

      function formatDelta(value) {
        if (value === null || value === undefined || !Number.isFinite(value)) return "—";
        return `${value >= 0 ? "+" : ""}${value.toFixed(2)}%`;
      }

      function delta(value, baseline) {
        if (value === null || value === undefined || baseline === null || baseline === undefined || baseline === 0) return null;
        return (Number(value) / Number(baseline) - 1) * 100;
      }

      function selectedRows() {
        const operator = selectedOperator();
        return operator.rows
          .filter(row => matches(row, fixedKeys[0], elements.fixedOne.value))
          .filter(row => matches(row, fixedKeys[1], elements.fixedTwo.value))
          .sort((a, b) => Number(a[elements.axis.value]) - Number(b[elements.axis.value]));
      }

      function measured(row) {
        return row.status === "measured" && row.correctness_status === "passed";
      }

      function baselineFor(rows, metric) {
        const row = rows.find(item => measured(item) && item[metric] !== null && item[metric] !== undefined);
        return row ? Number(row[metric]) : null;
      }

      function svgElement(name, attrs = {}, text = null) {
        const node = document.createElementNS(svgNS, name);
        Object.entries(attrs).forEach(([key, value]) => node.setAttribute(key, String(value)));
        if (text !== null) node.textContent = text;
        return node;
      }

      function chartValue(row, metric, baseline) {
        const raw = row[metric];
        if (!measured(row) || raw === null || raw === undefined) return null;
        return elements.mode.value === "relative" ? delta(Number(raw), baseline) : Number(raw);
      }

      function showTooltip(panel, tooltip, event, row, metric, value) {
        const bounds = panel.getBoundingClientRect();
        const axis = axes[elements.axis.value];
        tooltip.innerHTML = [
          `<strong>${axis.label}=${row[elements.axis.value]}</strong>`,
          `${metric === "latency_ms" ? "latency" : "UB"}: ${metric === "latency_ms" ? formatNumber(row[metric]) + " ms" : formatNumber(row[metric], 3) + " KiB"}`,
          elements.mode.value === "relative" ? `相对变化: ${formatDelta(value)}` : "",
          `状态: ${row.status}`
        ].filter(Boolean).join("<br>");
        tooltip.style.display = "block";
        const left = Math.min(event.clientX - bounds.left + 12, bounds.width - 270);
        const top = Math.max(event.clientY - bounds.top - 70, 44);
        tooltip.style.left = `${Math.max(8, left)}px`;
        tooltip.style.top = `${top}px`;
      }

      function drawChart(svgId, panelId, tooltipId, rows, metric, color, absoluteUnit) {
        const svg = document.getElementById(svgId);
        const panel = document.getElementById(panelId);
        const tooltip = document.getElementById(tooltipId);
        tooltip.style.display = "none";
        svg.replaceChildren();
        const width = Math.max(280, Math.floor(panel.clientWidth - 16));
        const height = 300;
        const margin = { top: 34, right: 20, bottom: 58, left: 72 };
        const plotWidth = width - margin.left - margin.right;
        const plotHeight = height - margin.top - margin.bottom;
        svg.setAttribute("viewBox", `0 0 ${width} ${height}`);
        const title = svgElement("title", {}, `${metric === "latency_ms" ? "执行时间" : "UB使用量"}随${axes[elements.axis.value].label}变化`);
        svg.appendChild(title);

        const baseline = baselineFor(rows, metric);
        const points = rows.map(row => ({ row, value: chartValue(row, metric, baseline) }));
        const values = points.filter(point => point.value !== null).map(point => point.value);
        if (!values.length) {
          svg.appendChild(svgElement("text", { x: width / 2, y: height / 2, "text-anchor": "middle", class: "chart-text" }, "当前切片没有可绘制的数据"));
          return;
        }

        let low = Math.min(...values);
        let high = Math.max(...values);
        if (elements.mode.value === "relative") {
          low = Math.min(low, 0);
          high = Math.max(high, 0);
        }
        let span = high - low;
        if (span === 0) {
          const seed = Math.max(Math.abs(high), 1);
          low -= seed * 0.08;
          high += seed * 0.08;
          span = high - low;
        }
        const pad = span * 0.14;
        low -= pad;
        high += pad;

        const x = index => rows.length === 1
          ? margin.left + plotWidth / 2
          : margin.left + index * plotWidth / (rows.length - 1);
        const y = value => margin.top + (high - value) * plotHeight / (high - low);
        const unit = elements.mode.value === "relative" ? "%" : absoluteUnit;

        for (let index = 0; index < 5; index += 1) {
          const tick = low + (high - low) * index / 4;
          const tickY = y(tick);
          svg.appendChild(svgElement("line", { x1: margin.left, y1: tickY, x2: margin.left + plotWidth, y2: tickY, class: "chart-grid" }));
          svg.appendChild(svgElement("text", { x: margin.left - 9, y: tickY + 4, "text-anchor": "end", class: "chart-muted" }, `${Number(tick.toPrecision(4))}`));
        }
        if (low <= 0 && high >= 0) {
          svg.appendChild(svgElement("line", { x1: margin.left, y1: y(0), x2: margin.left + plotWidth, y2: y(0), class: "chart-zero" }));
        }
        svg.appendChild(svgElement("rect", { x: margin.left, y: margin.top, width: plotWidth, height: plotHeight, class: "chart-frame", "data-chart-frame": "" }));

        rows.forEach((row, index) => {
          const position = x(index);
          svg.appendChild(svgElement("line", { x1: position, y1: margin.top + plotHeight, x2: position, y2: margin.top + plotHeight + 5, class: "chart-axis" }));
          svg.appendChild(svgElement("text", { x: position, y: margin.top + plotHeight + 22, "text-anchor": "middle", class: "chart-text" }, String(row[elements.axis.value])));
        });

        let segment = [];
        const flushSegment = () => {
          if (segment.length > 1) {
            svg.appendChild(svgElement("polyline", {
              points: segment.map(point => `${point.x},${point.y}`).join(" "),
              class: "chart-line",
              stroke: color
            }));
          }
          segment = [];
        };
        points.forEach((point, index) => {
          if (point.value === null) {
            flushSegment();
          } else {
            segment.push({ x: x(index), y: y(point.value) });
          }
        });
        flushSegment();

        points.forEach((point, index) => {
          if (point.value === null) return;
          const pointX = x(index);
          const pointY = y(point.value);
          const anchor = index === 0 ? "start" : index === rows.length - 1 ? "end" : "middle";
          svg.appendChild(svgElement("text", {
            x: pointX,
            y: Math.max(13, pointY - 10),
            "text-anchor": anchor,
            class: "chart-value"
          }, elements.mode.value === "relative" ? formatDelta(point.value) : formatNumber(point.value, metric === "latency_ms" ? 6 : 3)));
          svg.appendChild(svgElement("circle", { cx: pointX, cy: pointY, r: 5, fill: color, class: "chart-point" }));
          const hit = svgElement("circle", { cx: pointX, cy: pointY, r: 18, class: "chart-hit", "aria-label": `${axes[elements.axis.value].label} ${point.row[elements.axis.value]}, ${point.value} ${unit}` });
          hit.addEventListener("pointerenter", event => showTooltip(panel, tooltip, event, point.row, metric, point.value));
          hit.addEventListener("pointermove", event => showTooltip(panel, tooltip, event, point.row, metric, point.value));
          hit.addEventListener("pointerleave", () => { tooltip.style.display = "none"; });
          svg.appendChild(hit);
        });

        svg.appendChild(svgElement("text", { x: margin.left + plotWidth / 2, y: height - 8, "text-anchor": "middle", class: "axis-title", "data-axis": "x" }, axes[elements.axis.value].label));
        const yTitle = svgElement("text", { x: 17, y: margin.top + plotHeight / 2, "text-anchor": "middle", class: "axis-title", transform: `rotate(-90 17 ${margin.top + plotHeight / 2})`, "data-axis": "y" }, unit);
        svg.appendChild(yTitle);
      }

      function renderTable(rows) {
        elements.detailsBody.replaceChildren();
        elements.tableAxis.textContent = axes[elements.axis.value].label;
        const latencyBaseline = baselineFor(rows, "latency_ms");
        const ubBaseline = baselineFor(rows, "required_ub_kib");
        rows.forEach(row => {
          const tr = document.createElement("tr");
          const statusClass = measured(row) ? "status-measured" : "status-failed";
          const values = [
            String(row[elements.axis.value]),
            formatNumber(row.latency_ms),
            formatDelta(delta(row.latency_ms, latencyBaseline)),
            formatNumber(row.required_ub_kib, 3),
            formatDelta(delta(row.required_ub_kib, ubBaseline)),
            row.diagnostic ? `${row.status}: ${row.diagnostic}` : row.status,
            row.binary_hash ? row.binary_hash.slice(0, 12) : "—"
          ];
          values.forEach((value, index) => {
            const td = document.createElement("td");
            td.textContent = value;
            if (index === 5) td.className = statusClass;
            tr.appendChild(td);
          });
          elements.detailsBody.appendChild(tr);
        });
      }

      function render() {
        const operator = selectedOperator();
        currentRows = selectedRows();
        const allAxisValues = uniqueNumeric(operator.rows, elements.axis.value);
        const measuredRows = currentRows.filter(measured);
        const latencyValues = measuredRows.map(row => row.latency_ms).filter(value => value !== null);
        const ubValues = measuredRows.map(row => row.required_ub_kib).filter(value => value !== null);
        const binaries = new Set(measuredRows.map(row => row.binary_hash).filter(Boolean));
        const coverage = `${currentRows.length}/${allAxisValues.length}`;
        const warning = currentRows.length < allAxisValues.length ? " warning" : "";

        elements.runMeta.replaceChildren();
        [
          `run ${operator.run_id}`,
          operator.schema,
          `${operator.measured_count}/${operator.row_count} measured`,
          `${operator.distinct_binary_hashes} binaries`,
          `${operator.distinct_ttir_hashes} TTIR`
        ].forEach(text => {
          const span = document.createElement("span");
          span.textContent = text;
          elements.runMeta.appendChild(span);
        });

        const range = values => values.length ? `${Math.min(...values).toFixed(3)}–${Math.max(...values).toFixed(3)}` : "—";
        elements.summary.className = `selection-summary${warning}`;
        elements.summary.textContent = [
          `${axes[elements.axis.value].label} 覆盖 ${coverage}`,
          `latency ${range(latencyValues)} ms`,
          `UB ${range(ubValues)} KiB`,
          `${binaries.size} 个二进制`
        ].join(" · ");

        const relative = elements.mode.value === "relative";
        elements.latencyUnit.textContent = relative ? "相对变化 (%)" : "毫秒 (ms)";
        elements.ubUnit.textContent = relative ? "相对变化 (%)" : "KiB";
        drawChart("latency-chart", "latency-panel", "latency-tooltip", currentRows, "latency_ms", "var(--latency)", "ms");
        drawChart("ub-chart", "ub-panel", "ub-tooltip", currentRows, "required_ub_kib", "var(--ub)", "KiB");
        renderTable(currentRows);
      }

      report.operators.forEach(operator => {
        const option = document.createElement("option");
        option.value = operator.id;
        option.textContent = operator.label;
        elements.operator.appendChild(option);
      });
      axisKeys.forEach(key => {
        const option = document.createElement("option");
        option.value = key;
        option.textContent = axes[key].label;
        elements.axis.appendChild(option);
      });

      elements.operator.addEventListener("change", () => {
        rememberFixedValues();
        refreshFilters();
      });
      elements.axis.addEventListener("change", () => {
        rememberFixedValues();
        refreshFilters();
      });
      elements.fixedOne.addEventListener("change", () => {
        preferredValues[fixedKeys[0]] = elements.fixedOne.value;
        refreshSecondFixed();
        render();
      });
      elements.fixedTwo.addEventListener("change", () => {
        preferredValues[fixedKeys[1]] = elements.fixedTwo.value;
        render();
      });
      elements.mode.addEventListener("change", render);
      let observedWidth = 0;
      new ResizeObserver(entries => {
        const width = Math.round(entries[0].contentRect.width);
        if (width !== observedWidth) {
          observedWidth = width;
          render();
        }
      }).observe(document.querySelector(".charts"));
      refreshFilters();
    })();
  </script>
</body>
</html>
