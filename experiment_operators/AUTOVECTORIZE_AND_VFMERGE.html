  background-color: color-mix(in srgb, var(--foreground) 6%, var(--secondary));
}

.form-select:focus-visible {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-check {
  display: flex;
  min-height: 20px;
  align-items: center;
  gap: 6px;
}

.form-check-input {
  appearance: none;
  width: 14px;
  height: 14px;
  flex: 0 0 auto;
  margin: 0;
  border: 1px solid var(--input);
  color: var(--primary-foreground);
  background-color: transparent;
  cursor: var(--cursor-interaction, default);
  transition:
    background-color 150ms,
    border-color 150ms,
    box-shadow 150ms;
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;] {
  border-color: var(--input);
  border-radius: var(--radius-sm);
  corner-shape: var(--corner-shape);
  background-color: var(--secondary);
  box-shadow: var(--shadow-sm);
}

.form-check:not(.form-switch)
  .form-check-input:not(:disabled):not(:checked):hover {
  background-color: var(--card);
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;]:checked {
  border-color: var(--primary);
  background-color: var(--primary);
}

.form-check:not(.form-switch)
  .form-check-input[type=&quot;checkbox&quot;]:checked::before {
  display: block;
  width: 100%;
  height: 100%;
  background: var(--primary-foreground);
  content: &quot;&quot;;
  mask: var(--checkmark-image) center / 12px 12px no-repeat;
}

.form-check-input[type=&quot;radio&quot;] {
  width: 14px;
  height: 14px;
  border-radius: var(--radius-full);
}

.form-check-input[type=&quot;radio&quot;]:checked {
  border: 2px solid var(--primary);
  background:
    radial-gradient(circle, var(--primary-foreground) 0 2.5px, transparent 3px),
    var(--primary);
}

.form-check:not(.form-switch) .form-check-input:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

.form-check:not(.form-switch) .form-check-input:disabled {
  cursor: not-allowed;
  pointer-events: none;
}

.form-check:not(.form-switch) .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
}

.form-switch .form-check-input:disabled,
.form-switch .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
  opacity: 0.6;
}

.form-check-label {
  color: var(--foreground);
  cursor: var(--cursor-interaction, default);
}

.form-switch .form-check-input {
  position: relative;
  width: 32px;
  height: 20px;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
  box-shadow: none;
  transition: background-color 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input::before {
  position: absolute;
  top: 50%;
  left: 0;
  width: 16px;
  height: 16px;
  box-sizing: border-box;
  border: 1px solid light-dark(var(--primary-foreground), var(--foreground));
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
  box-shadow: var(--shadow-sm);
  content: &quot;&quot;;
  transform: translate(2px, -50%);
  transition: transform 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {
  transform: translate(14px, -50%);
}

.form-switch .form-check-input:focus-visible {
  box-shadow: 0 0 0 2px var(--ring);
}

.form-range {
  appearance: none;
  display: block;
  width: 100%;
  height: 28px;
  flex: 1;
  margin: 0;
  padding: 0;
  outline: none;
  border: 0;
  accent-color: var(--primary);
  background: linear-gradient(
      color-mix(in srgb, var(--foreground) 7%, transparent),
      color-mix(in srgb, var(--foreground) 7%, transparent)
    )
    center / 100% 2px no-repeat;
}

.form-range::-webkit-slider-runnable-track {
  height: 28px;
  background: transparent;
}

.form-range::-webkit-slider-thumb {
  appearance: none;
  width: 20px;
  height: 20px;
  margin-top: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-webkit-slider-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.btn:not(.btn-primary, .viz-tile):is(
  [aria-pressed=&quot;true&quot;],
  [aria-selected=&quot;true&quot;],
  .is-selected
) {
  border-color: var(--primary);
  color: var(--primary-foreground);
  background: var(--primary);
}

.btn.viz-tile:is([aria-pressed=&quot;true&quot;], [aria-selected=&quot;true&quot;], .is-selected) {
  border-color: var(--primary);
  box-shadow: inset 0 0 0 1px var(--primary);
}

.btn:focus-visible,
.nav-link:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

@media (pointer: coarse) {
  .btn,
  .nav-link,
  .form-control,
  .form-select {
    min-width: 44px;
    min-height: 44px;
  }

  /* Keep small-screen WebKit from zooming when a text field receives focus. */
  .form-control,
  .form-select {
    font-size: max(16px, var(--font-size-normal));
  }

  .form-control[type=&quot;file&quot;]::file-selector-button {
    min-width: 44px;
    min-height: 44px;
  }

  .form-control-color[type=&quot;color&quot;] {
    width: 44px;
    height: 44px;
  }

  .form-control:is(
    [type=&quot;date&quot;],
    [type=&quot;datetime-local&quot;],
    [type=&quot;month&quot;],
    [type=&quot;time&quot;],
    [type=&quot;week&quot;]
  ) {
    min-width: 0;
    max-width: 100%;
    padding-block: 8px;
  }

  .form-check {
    min-height: 44px;
    padding-inline: 15px;
  }

  .form-check-input {
    position: relative;
  }

  .form-check-input::after {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 44px;
    height: 44px;
    content: &quot;&quot;;
    transform: translate(-50%, -50%);
  }

  .form-check-label {
    display: inline-flex;
    min-width: 44px;
    min-height: 44px;
    align-items: center;
  }

  .form-range {
    height: 44px;
    touch-action: pan-y;
  }

  .form-range::-webkit-slider-runnable-track {
    height: 44px;
  }

  .form-range::-moz-range-track {
    height: 44px;
  }

  .form-range::-webkit-slider-thumb {
    margin-top: 12px;
  }
}

svg {
  display: block;
  max-width: 100%;
  height: auto;
}

#widget &gt; svg {
  width: 100%;
}

/* Model-authored chart rules can otherwise stretch icons after these styles load. */
svg.lucide {
  display: block;
  width: var(--icon-size) !important;
  height: var(--icon-size) !important;
  flex: none;
  margin: 0 !important;
  stroke-width: 1.6;
}

.text-warning,
.text-destructive {
  color: var(--destructive);
}

    &lt;div class=&quot;avx-lanes&quot;&gt;
      &lt;div class=&quot;avx-lane&quot;&gt;
        &lt;div class=&quot;avx-lane-name&quot;&gt;当前 vfs&lt;/div&gt;
        &lt;div class=&quot;avx-items&quot; data-vfs aria-label=&quot;当前 VF 主列表&quot;&gt;&lt;/div&gt;
      &lt;/div&gt;
      &lt;div class=&quot;avx-lane&quot;&gt;
        &lt;div class=&quot;avx-lane-name&quot;&gt;待处理&lt;/div&gt;
        &lt;div class=&quot;avx-items&quot; data-work aria-label=&quot;待处理工作队列&quot;&gt;&lt;/div&gt;
      &lt;/div&gt;
    &lt;/div&gt;
    &lt;div class=&quot;avx-decision&quot; data-decision aria-live=&quot;polite&quot;&gt;&lt;/div&gt;
  &lt;/section&gt;

  &lt;section class=&quot;avx-view&quot; data-panel=&quot;extract&quot; role=&quot;tabpanel&quot;&gt;
    &lt;div class=&quot;avx-compare&quot;&gt;
      &lt;div class=&quot;avx-timeline&quot;&gt;
        &lt;h3&gt;不合并：局部 V→S wait&lt;/h3&gt;
        &lt;div class=&quot;avx-time-row&quot;&gt;
          &lt;div class=&quot;avx-time-label&quot;&gt;Vector&lt;/div&gt;
          &lt;div class=&quot;avx-track&quot;&gt;
            &lt;div class=&quot;avx-segment&quot; style=&quot;width:26%&quot;&gt;small VF&lt;/div&gt;
            &lt;div class=&quot;avx-segment&quot; style=&quot;width:58%&quot;&gt;large VF&lt;/div&gt;
          &lt;/div&gt;
        &lt;/div&gt;
        &lt;div class=&quot;avx-time-row&quot;&gt;
          &lt;div class=&quot;avx-time-label&quot;&gt;Scalar&lt;/div&gt;
          &lt;div class=&quot;avx-track&quot;&gt;
            &lt;div class=&quot;avx-gap&quot; style=&quot;width:20%&quot;&gt;&lt;/div&gt;
            &lt;div class=&quot;avx-segment wait&quot; style=&quot;width:16%&quot;&gt;wait&lt;/div&gt;
            &lt;div class=&quot;avx-segment scalar&quot; style=&quot;width:25%&quot;&gt;extract&lt;/div&gt;
          &lt;/div&gt;
        &lt;/div&gt;
        &lt;div class=&quot;avx-caption&quot;&gt;标量只等待产生 tensor&amp;lt;1xf32&amp;gt; 的 small VF。&lt;/div&gt;
      &lt;/div&gt;
      &lt;div class=&quot;avx-timeline&quot;&gt;
        &lt;h3&gt;强行合并：同步边界扩大&lt;/h3&gt;
        &lt;div class=&quot;avx-time-row&quot;&gt;
          &lt;div class=&quot;avx-time-label&quot;&gt;Vector&lt;/div&gt;
          &lt;div class=&quot;avx-track&quot;&gt;
            &lt;div class=&quot;avx-segment&quot; style=&quot;width:84%&quot;&gt;merged VF = small + large&lt;/div&gt;
          &lt;/div&gt;
        &lt;/div&gt;
        &lt;div class=&quot;avx-time-row&quot;&gt;
          &lt;div class=&quot;avx-time-label&quot;&gt;Scalar&lt;/div&gt;
          &lt;div class=&quot;avx-track&quot;&gt;
            &lt;div class=&quot;avx-gap&quot; style=&quot;width:70%&quot;&gt;&lt;/div&gt;
            &lt;div class=&quot;avx-segment wait&quot; style=&quot;width:15%&quot;&gt;wait&lt;/div&gt;
            &lt;div class=&quot;avx-segment scalar&quot; style=&quot;width:15%&quot;&gt;extract&lt;/div&gt;
          &lt;/div&gt;
        &lt;/div&gt;
        &lt;div class=&quot;avx-caption&quot;&gt;标量可能等待整个 merged VF，推迟 ping/pong buffer 轮换。&lt;/div&gt;
      &lt;/div&gt;
    &lt;/div&gt;
  &lt;/section&gt;

  &lt;section class=&quot;avx-view&quot; data-panel=&quot;examples&quot; role=&quot;tabpanel&quot;&gt;
    &lt;div class=&quot;avx-examples&quot;&gt;
      &lt;div class=&quot;avx-example-list&quot; aria-label=&quot;选择算子例子&quot;&gt;
        &lt;button type=&quot;button&quot; aria-pressed=&quot;true&quot; data-example=&quot;0&quot;&gt;Add + Exp&lt;/button&gt;
        &lt;button type=&quot;button&quot; aria-pressed=&quot;false&quot; data-example=&quot;1&quot;&gt;两个独立初始化&lt;/button&gt;
        &lt;button type=&quot;button&quot; aria-pressed=&quot;false&quot; data-example=&quot;2&quot;&gt;Softmax&lt;/button&gt;
        &lt;button type=&quot;button&quot; aria-pressed=&quot;false&quot; data-example=&quot;3&quot;&gt;Flash Attention&lt;/button&gt;
        &lt;button type=&quot;button&quot; aria-pressed=&quot;false&quot; data-example=&quot;4&quot;&gt;依赖图更新&lt;/button&gt;
        &lt;button type=&quot;button&quot; aria-pressed=&quot;false&quot; data-example=&quot;5&quot;&gt;HSTU 同步边界&lt;/button&gt;
      &lt;/div&gt;
      &lt;div class=&quot;avx-example-main&quot;&gt;
        &lt;div class=&quot;avx-example-heading&quot;&gt;
          &lt;strong data-example-title&gt;&lt;/strong&gt;
          &lt;span class=&quot;avx-example-outcome&quot; data-example-outcome&gt;&lt;/span&gt;
        &lt;/div&gt;
        &lt;div class=&quot;avx-example-flow&quot; data-example-flow aria-label=&quot;算子变化流程&quot;&gt;&lt;/div&gt;
        &lt;div class=&quot;avx-example-ir&quot;&gt;
          &lt;div class=&quot;avx-ir-side&quot;&gt;
            &lt;div class=&quot;avx-ir-label&quot;&gt;变化前&lt;/div&gt;
            &lt;pre class=&quot;avx-code&quot; data-example-before&gt;&lt;/pre&gt;
          &lt;/div&gt;
          &lt;div class=&quot;avx-ir-side&quot;&gt;
            &lt;div class=&quot;avx-ir-label&quot;&gt;变化后&lt;/div&gt;
            &lt;pre class=&quot;avx-code&quot; data-example-after&gt;&lt;/pre&gt;
          &lt;/div&gt;
        &lt;/div&gt;
        &lt;div class=&quot;avx-example-note&quot; data-example-note&gt;&lt;/div&gt;
      &lt;/div&gt;
    &lt;/div&gt;
  &lt;/section&gt;

  &lt;script&gt;
    (() =&gt; {
      const root = document.getElementById(&#x27;av-vfm-explainer&#x27;);
      const tabs = Array.from(root.querySelectorAll(&#x27;[data-view]&#x27;));
      const panels = Array.from(root.querySelectorAll(&#x27;[data-panel]&#x27;));
      const stageButtons = Array.from(root.querySelectorAll(&#x27;[data-stage]&#x27;));
      const stageLabel = root.querySelector(&#x27;[data-stage-label]&#x27;);
      const stageCode = root.querySelector(&#x27;[data-stage-code]&#x27;);
      const stepStatus = root.querySelector(&#x27;[data-step-status]&#x27;);
      const vfsNode = root.querySelector(&#x27;[data-vfs]&#x27;);
      const workNode = root.querySelector(&#x27;[data-work]&#x27;);
      const decisionNode = root.querySelector(&#x27;[data-decision]&#x27;);
      const prevButton = root.querySelector(&#x27;[data-prev]&#x27;);
      const nextButton = root.querySelector(&#x27;[data-next]&#x27;);
      const exampleButtons = Array.from(root.querySelectorAll(&#x27;[data-example]&#x27;));
      const exampleTitle = root.querySelector(&#x27;[data-example-title]&#x27;);
      const exampleOutcome = root.querySelector(&#x27;[data-example-outcome]&#x27;);
      const exampleFlow = root.querySelector(&#x27;[data-example-flow]&#x27;);
      const exampleBefore = root.querySelector(&#x27;[data-example-before]&#x27;);
      const exampleAfter = root.querySelector(&#x27;[data-example-after]&#x27;);
      const exampleNote = root.querySelector(&#x27;[data-example-note]&#x27;);

      const stages = [
        {
          label: &#x27;Linalg 表达“算什么”，此时还没有固定每次处理多少元素。&#x27;,
          code: &#x27;%tmp = linalg.elemwise_binary {add} ins(%a, %b)\n%out = linalg.elemwise_unary {exp} ins(%tmp)&#x27;
        },
        {
          label: &#x27;AutoVectorize 将 256 个元素切成 4 个 64-element tile；Add 的 Vector 结果直接交给 Exp。&#x27;,
          code: &#x27;scf.for %offset = 0 to 256 step 64 {\n  %va = vector.transfer_read ... : vector&lt;64xf32&gt;\n  %vb = vector.transfer_read ... : vector&lt;64xf32&gt;\n  %sum = arith.addf %va, %vb : vector&lt;64xf32&gt;\n  %out = math.exp %sum : vector&lt;64xf32&gt;\n}&#x27;
        },
        {
          label: &#x27;Outline 把 Vector 循环抽成独立函数；hivm.vector_function 是 VF 的直接身份标记。&#x27;,
          code: &#x27;func.func @kernel_outlined_vf_0(...)\n    attributes {hivm.vector_function, no_inline} {\n  scf.for ... { ... vector&lt;64xf32&gt; ... }\n}&#x27;
        },
        {
          label: &#x27;Level 1 只合并无依赖、同 Region、同步与 ExtractKind 均兼容的 VF。&#x27;,
          code: &#x27;%r:2 = call @kernel_merged_vf_0(%a, %b)\n    {hivm.vector_function, ptc_simdvf}\n// 原两次调用的结果改接到 %r#0 和 %r#1&#x27;
        }
      ];

      const greedySteps = [
        { vfs: [&#x27;A&#x27;,&#x27;B&#x27;,&#x27;C&#x27;,&#x27;D&#x27;,&#x27;E&#x27;], work: [&#x27;A&#x27;,&#x27;B&#x27;,&#x27;C&#x27;,&#x27;D&#x27;,&#x27;E&#x27;], current: &#x27;A&#x27;, decision: &#x27;A 的右邻居是 B：1 + 1 ≤ 4，合并。&#x27; },
        { vfs: [&#x27;AB&#x27;,&#x27;C&#x27;,&#x27;D&#x27;,&#x27;E&#x27;], work: [&#x27;B&#x27;,&#x27;C&#x27;,&#x27;D&#x27;,&#x27;E&#x27;,&#x27;AB&#x27;], current: &#x27;B&#x27;, decision: &#x27;B 已被删除，跳过；AB 已追加到 worklist 末尾。&#x27; },
        { vfs: [&#x27;AB&#x27;,&#x27;C&#x27;,&#x27;D&#x27;,&#x27;E&#x27;], work: [&#x27;C&#x27;,&#x27;D&#x27;,&#x27;E&#x27;,&#x27;AB&#x27;], current: &#x27;C&#x27;, decision: &#x27;C 的右邻居是 D：合并为 CD。&#x27; },
        { vfs: [&#x27;AB&#x27;,&#x27;CD&#x27;,&#x27;E&#x27;], work: [&#x27;E&#x27;,&#x27;AB&#x27;,&#x27;CD&#x27;], current: &#x27;E&#x27;, decision: &#x27;D 已失效；E 在 vfs 最右侧，没有右邻居。不会尝试 E + AB。&#x27; },
        { vfs: [&#x27;AB&#x27;,&#x27;CD&#x27;,&#x27;E&#x27;], work: [&#x27;AB&#x27;,&#x27;CD&#x27;], current: &#x27;AB&#x27;, decision: &#x27;AB 的右邻居是 CD：2 + 2 = 4，合并为 ABCD。&#x27; },
        { vfs: [&#x27;ABCD&#x27;,&#x27;E&#x27;], work: [&#x27;ABCD&#x27;], current: &#x27;ABCD&#x27;, decision: &#x27;ABCD 的右邻居是 E：4 + 1 &gt; 4，拒绝。最终 [ABCD, E]。&#x27; }
      ];
      let greedyIndex = 0;

      const examples = [
        {
          title: &#x27;Add + Exp&#x27;,
          outcome: &#x27;AutoVectorize：两个 Linalg → 一个 Vector tile 循环&#x27;,
          flow: [&#x27;linalg.add&#x27;, &#x27;linalg.exp&#x27;, &#x27;scf.for step 64&#x27;, &#x27;1 个 outlined VF&#x27;],
          before: &#x27;%tmp = linalg.add %a, %b\n%out = linalg.exp %tmp&#x27;,
          after: &#x27;scf.for %offset = 0 to 256 step 64 {\n  %sum = arith.addf %va, %vb : vector&lt;64xf32&gt;\n  %out = math.exp %sum : vector&lt;64xf32&gt;\n}&#x27;,
          note: &#x27;Exp 直接消费同一 tile 的 Add 结果，不生成完整中间 Tensor；Outline 后只有一个 VF，VFMerge 无事可做。&#x27;
        },
        {
          title: &#x27;两个独立初始化&#x27;,
          outcome: &#x27;VFMerge：两个 VF → 一个 merged VF&#x27;,
          flow: [&#x27;A[:] = 0&#x27;, &#x27;B[:] = -inf&#x27;, &#x27;2 个 outlined VF&#x27;, &#x27;1 个 merged VF&#x27;],
          before: &#x27;%a = call @init_zero_vf(%A)\n%b = call @init_neg_inf_vf(%B)&#x27;,
          after: &#x27;%r:2 = call @init_merged_vf(%A, %B)\n    {hivm.vector_function, ptc_simdvf}\n// %r#0 = A，%r#1 = B&#x27;,
          note: &#x27;两个初始化访问不同数据，没有 SSA/内存依赖，Region 和 ExtractKind 也一致，因此 Level 1 可以合并。&#x27;
        },
        {
          title: &#x27;Softmax&#x27;,
          outcome: &#x27;AutoVectorize 生效；VFMerge 保留依赖边界&#x27;,
          flow: [&#x27;vf_max&#x27;, &#x27;vf_sub_exp&#x27;, &#x27;vf_sum&#x27;, &#x27;vf_div&#x27;],
          before: &#x27;max = reduce_max(x)\nexp = exp(x - max)\nsum = reduce_sum(exp)\nout = exp / sum&#x27;,
          after: &#x27;vf_max → vf_sub_exp → vf_sum → vf_div\n// 每个下游 VF 消费上游结果\n// Level 1 不合并这条依赖链&#x27;,
          note: &#x27;Sub + Exp 可以在 AutoVectorize 阶段做 tile 内融合；这不等于 VFMerge 可以跨越 Max、Sum、Div 的 VF 依赖。&#x27;
        },
        {
          title: &#x27;Flash Attention&#x27;,
          outcome: &#x27;四个独立初始化 VF → 一次四结果调用&#x27;,
          flow: [&#x27;写 0.5&#x27;, &#x27;写 0&#x27;, &#x27;矩阵清零&#x27;, &#x27;写 -inf&#x27;, &#x27;merged VF（上限 4）&#x27;],
          before: &#x27;%a = call @vf_3(...)\n%b = call @vf_2(...)\n%c = call @vf_1(...)\n%d = call @vf_0(...)&#x27;,
          after: &#x27;%r:4 = call @_attn_fwd_outlined_merged_merged_vf_0(\n    %a0, %b0, %c0, %d0)\n    {hivm.vector_function, ptc_simdvf}&#x27;,
          note: &#x27;合并的是主循环前的 Vector 初始化，不是 Q×K 或 P×V 的 Cube 矩阵乘；四项初始化仍然全部执行。&#x27;
        },
        {
          title: &#x27;依赖图更新&#x27;,
          outcome: &#x27;两组合并成功；第三次合并被最新依赖图阻止&#x27;,
          flow: [&#x27;producer + zero&#x27;, &#x27;producer_zero&#x27;, &#x27;reduce_a + reduce_b&#x27;, &#x27;reductions&#x27;, &#x27;保持依赖&#x27;],
          before: &#x27;producer      zero\n                ↙     ↘\n          reduce_a   reduce_b&#x27;,
          after: &#x27;%p:2 = call @producer_merged_vf(...)\n%r:2 = call @reduce_merged_vf(%p#1, %p#1)\n// producer_zero → reductions&#x27;,
          note: &#x27;score 只选择初始起点；merged VF 回到 worklist 后，areRelated() 必须使用 mergeNodes() 更新后的图再次检查。&#x27;
        },
        {
          title: &#x27;HSTU 同步边界&#x27;,
          outcome: &#x27;显式同步位于调用之间：不合并&#x27;,
          flow: [&#x27;vf_a&#x27;, &#x27;sync_block_set&#x27;, &#x27;sync_block_wait&#x27;, &#x27;vf_b&#x27;],
          before: &#x27;call @vf_a(...)\nhivm.sync_block_set ...\nhivm.sync_block_wait ...\ncall @vf_b(...)&#x27;,
          after: &#x27;call @vf_a(...)\nhivm.sync_block_set ...\nhivm.sync_block_wait ...\ncall @vf_b(...)\n// 保持原边界&#x27;,
          note: &#x27;即使两个 VF 的结果没有直接 SSA 关系，Level 1 也不会跨越显式同步；这是独立于 score 的合法性检查。&#x27;
        }
      ];

      function selectView(name) {
        tabs.forEach((tab) =&gt; {
          const selected = tab.dataset.view === name;
          tab.setAttribute(&#x27;aria-selected&#x27;, String(selected));
          tab.setAttribute(&#x27;aria-pressed&#x27;, String(selected));
        });
        panels.forEach((panel) =&gt; panel.classList.toggle(&#x27;is-active&#x27;, panel.dataset.panel === name));
      }

      function selectStage(index) {
        const stage = stages[index];
        stageButtons.forEach((button) =&gt; button.setAttribute(&#x27;aria-pressed&#x27;, String(Number(button.dataset.stage) === index)));
        stageLabel.textContent = stage.label;
        stageCode.textContent = stage.code;
      }

      function renderChips(node, values, current) {
        node.replaceChildren(...values.map((value) =&gt; {
          const chip = document.createElement(&#x27;span&#x27;);
          chip.className = &#x27;avx-chip&#x27;;
          if (value === current) chip.classList.add(&#x27;is-current&#x27;);
          if (value.length &gt; 1) chip.classList.add(&#x27;is-merged&#x27;);
          chip.textContent = value;
          return chip;
        }));
      }

      function renderGreedy() {
        const step = greedySteps[greedyIndex];
        stepStatus.textContent = `步骤 ${greedyIndex + 1} / ${greedySteps.length}`;
        renderChips(vfsNode, step.vfs, step.current);
        renderChips(workNode, step.work, step.current);
        decisionNode.textContent = step.decision;
        prevButton.disabled = greedyIndex === 0;
        nextButton.disabled = greedyIndex === greedySteps.length - 1;
      }

      function renderExample(index) {
        const example = examples[index];
        exampleButtons.forEach((button) =&gt; button.setAttribute(&#x27;aria-pressed&#x27;, String(Number(button.dataset.example) === index)));
        exampleTitle.textContent = example.title;
        exampleOutcome.textContent = example.outcome;
        exampleBefore.textContent = example.before;
        exampleAfter.textContent = example.after;
        exampleNote.textContent = example.note;
        const nodes = [];
        example.flow.forEach((value, position) =&gt; {
          const chip = document.createElement(&#x27;span&#x27;);
          chip.className = &#x27;avx-chip&#x27;;
          if (position === example.flow.length - 1) chip.classList.add(&#x27;is-merged&#x27;);
          chip.textContent = value;
          nodes.push(chip);
          if (position &lt; example.flow.length - 1) {
            const arrow = document.createElement(&#x27;span&#x27;);
            arrow.className = &#x27;avx-example-arrow&#x27;;
            arrow.textContent = &#x27;→&#x27;;
            nodes.push(arrow);
          }
        });
        exampleFlow.replaceChildren(...nodes);
      }

      tabs.forEach((tab) =&gt; tab.addEventListener(&#x27;click&#x27;, () =&gt; selectView(tab.dataset.view)));
      stageButtons.forEach((button) =&gt; button.addEventListener(&#x27;click&#x27;, () =&gt; selectStage(Number(button.dataset.stage))));
      prevButton.addEventListener(&#x27;click&#x27;, () =&gt; {
        if (greedyIndex &gt; 0) greedyIndex -= 1;
        renderGreedy();
      });
      nextButton.addEventListener(&#x27;click&#x27;, () =&gt; {
        if (greedyIndex &lt; greedySteps.length - 1) greedyIndex += 1;
        renderGreedy();
      });
      exampleButtons.forEach((button) =&gt; button.addEventListener(&#x27;click&#x27;, () =&gt; renderExample(Number(button.dataset.example))));

      selectStage(0);
      renderGreedy();
      renderExample(0);
    })();
  &lt;/script&gt;
&lt;/div&gt;

&lt;script src=&quot;https://unpkg.com/@floating-ui/core@1.7.3/dist/floating-ui.core.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script src=&quot;https://unpkg.com/@floating-ui/dom@1.7.4/dist/floating-ui.dom.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;
(() =&gt; {
  if (window.FloatingUIDOM == null) {
    return;
  }
  const { autoUpdate, computePosition, flip, offset, shift, size } =
    window.FloatingUIDOM;
  const tooltipPlacements = new Set([&quot;top&quot;, &quot;right&quot;, &quot;bottom&quot;, &quot;left&quot;]);
  const tooltipId = `codex-visualization-tooltip-${
    window.crypto?.randomUUID?.() ?? Date.now().toString(36)
  }`;
  const tooltipGap = 5;
  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;
  let positionRequest = 0;
  let skipDelayUntil = 0;
  let lastPointerWasTouch = false;
  let pinnedByTouch = false;

  const getTrigger = (target) =&gt;
    target?.nodeType === Node.ELEMENT_NODE
      ? target.closest(&quot;[data-tooltip]&quot;)
      : null;
  const containsTarget = (trigger, target) =&gt;
    target?.nodeType != null &amp;&amp; trigger.contains(target);
  const getContent = (trigger) =&gt;
    trigger.getAttribute(&quot;data-tooltip&quot;)?.trim() ?? &quot;&quot;;
  const getPlacement = (trigger) =&gt; {
    const placement = trigger.getAttribute(&quot;data-tooltip-placement&quot;);
    return tooltipPlacements.has(placement) ? placement : &quot;top&quot;;
  };
  const getTooltip = () =&gt; {
    if (tooltip == null) {
      tooltip = document.createElement(&quot;div&quot;);
      tooltip.id = tooltipId;
      tooltip.className = &quot;tooltip&quot;;
      tooltip.setAttribute(&quot;role&quot;, &quot;tooltip&quot;);
    }
    return tooltip;
  };
  const setDescribedBy = (trigger, described) =&gt; {
    const ids = new Set(
      (trigger.getAttribute(&quot;aria-describedby&quot;) ?? &quot;&quot;)
        .split(/\s+/)
        .filter(Boolean),
    );
    if (described) {
      ids.add(tooltipId);
    } else {
      ids.delete(tooltipId);
    }
    if (ids.size === 0) {
      trigger.removeAttribute(&quot;aria-describedby&quot;);
    } else {
      trigger.setAttribute(&quot;aria-describedby&quot;, [...ids].join(&quot; &quot;));
    }
  };
  const clearOpenTimeout = () =&gt; {
    if (openTimeout != null) {
      window.clearTimeout(openTimeout);
      openTimeout = null;
    }
    pendingTrigger = null;
  };
  const closeTooltip = (activateSkipDelay = true) =&gt; {
    clearOpenTimeout();
    pinnedByTouch = false;
    positionRequest += 1;
    autoUpdateCleanup?.();
    autoUpdateCleanup = null;
    if (activeTrigger == null) {
      return;
    }
    setDescribedBy(activeTrigger, false);
    activeTrigger = null;
    tooltip?.remove();
    if (activateSkipDelay) {
      skipDelayUntil = Date.now() + skipDelay;
    }
  };
  const updatePosition = (trigger, floating) =&gt; {
    const request = ++positionRequest;
    void computePosition(trigger, floating, {
      middleware: [
        offset(tooltipGap),
