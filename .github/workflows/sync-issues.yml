name: Sync Triton-Ascend Issues

on:
  schedule:
    - cron: '0 0 * * *'   # Beijing 08:00
    - cron: '0 6 * * *'   # Beijing 14:00
    - cron: '0 10 * * *'  # Beijing 18:00
  workflow_dispatch:      # Allow manual trigger

permissions:
  contents: read
  issues: read

concurrency:
  group: sync-issues
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install requests

      - run: python .github/workflows/scripts/sync_issues.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHEET_ID: ${{ secrets.SHEET_ID }}
          SHEET_WEBAPP_URL: ${{ secrets.SHEET_WEBAPP_URL }}
